<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Panel Admin | Tarjeta Link</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1020;
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

h1{
margin-bottom:30px;
}

.card{
background:#151f3d;
padding:20px;
border-radius:16px;
margin-bottom:30px;
}

.form{
display:flex;
gap:10px;
flex-wrap:wrap;
}

input{
flex:1;
min-width:220px;

padding:14px;

border:none;

border-radius:10px;

background:#0d1631;

color:white;
}

button{

padding:14px 20px;

border:none;

border-radius:10px;

background:#3a7bff;

color:white;

cursor:pointer;

}

button:hover{
opacity:.95;
}

table{

width:100%;

border-collapse:collapse;

overflow:hidden;

}

th{

text-align:left;

padding:16px;

background:#182652;

}

td{

padding:16px;

border-bottom:1px solid #26314f;

}

.empty{

padding:30px;

text-align:center;

opacity:.6;

}

</style>

</head>

<body>

<div class="container">

<h1>🔥 Panel Admin Tarjeta Link</h1>

<div class="card">

<div class="form">

<input
id="name"
placeholder="Nombre del negocio"
>

<input
id="owner"
placeholder="Propietario"
>

<button onclick="createBusiness()">
Crear negocio
</button>

</div>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>Negocio</th>

<th>Propietario</th>

</tr>

</thead>

<tbody id="list">

<tr>

<td colspan="2" class="empty">

Sin negocios

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getFirestore,

collection,

addDoc,

onSnapshot,

serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyA6BsCxdMu8CoFQJ2tcrPR0KPK9BFDloIU",

authDomain:
"tarjeta-link-94df7.firebaseapp.com",

projectId:
"tarjeta-link-94df7",

storageBucket:
"tarjeta-link-94df7.firebasestorage.app",

messagingSenderId:
"502965046746",

appId:
"1:502965046746:web:ceb673b54e066805f284e3",

measurementId:
"G-JKE4YGX377"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.createBusiness =
async ()=>{

const name =
document
.getElementById("name")
.value
.trim();

const owner =
document
.getElementById("owner")
.value
.trim();

if(!name||!owner){

alert(
"Completa todos los campos"
);

return;

}

try{

await addDoc(

collection(
db,
"businesses"
),

{

name,

owner,

plan:
"Inicio",

status:
"active",

createdAt:
serverTimestamp()

}

);

document
.getElementById("name")
.value="";

document
.getElementById("owner")
.value="";

alert(
"Negocio creado"
);

}

catch(error){

console.log(error);

alert(
"Error al guardar"
);

}

};

onSnapshot(

collection(
db,
"businesses"
),

(snapshot)=>{

let html="";

snapshot.forEach((doc)=>{

const d=
doc.data();

html+=`

<tr>

<td>
${d.name||"-"}
</td>

<td>
${d.owner||"-"}
</td>

</tr>

`;

});

if(html===""){

html=`

<tr>

<td colspan="2" class="empty">

Sin negocios

</td>

</tr>

`;

}

document
.getElementById("list")
.innerHTML=
html;

}

);

</script>

</body>

</html>
