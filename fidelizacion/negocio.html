<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Panel Negocio | Tarjeta Link</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#091326;
color:white;
}

.container{
display:grid;
grid-template-columns:260px 1fr;
min-height:100vh;
}

.sidebar{
background:#111c3d;
padding:30px;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:40px;
}

.menu{
display:flex;
flex-direction:column;
gap:12px;
}

.menu button{
padding:14px;
background:#18284e;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
text-align:left;
}

.menu button:hover{
background:#2b4785;
}

.content{
padding:30px;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#131f45;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
}

button.primary{
margin-top:12px;
padding:12px;
background:#3a7bff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
width:100%;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:14px;
border-bottom:1px solid #223760;
}

.qr{
text-align:center;
padding:40px;
}

.qr img{
width:220px;
}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">

TARJETA LINK

</div>

<div class="menu">

<button onclick="show('clientes')">
👥 Clientes
</button>

<button onclick="show('recompensas')">
🎁 Recompensas
</button>

<button onclick="show('visitas')">
📈 Visitas
</button>

<button onclick="show('tarjeta')">
🎨 Configurar Tarjeta
</button>

<button onclick="show('qr')">
📲 Descargar QR
</button>

</div>

</div>

<div class="content">

<!-- CLIENTES -->

<div id="clientes" class="panel active">

<h2>Clientes</h2>

<div class="card">

<input
id="customerName"
placeholder="Nombre cliente"
>

<input
id="customerPhone"
placeholder="Teléfono"
>

<button
class="primary"
onclick="saveCustomer()"
>

Crear Cliente

</button>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>Cliente</th>

<th>Teléfono</th>

<th>Visitas</th>

</tr>

</thead>

<tbody id="customerList">

<tr>

<td colspan="3">

Sin clientes

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- RECOMPENSAS -->

<div id="recompensas" class="panel">

<h2>Crear recompensa</h2>

<div class="card">

<input placeholder="Nombre recompensa">

<input placeholder="Visitas requeridas">

<button class="primary">

Guardar

</button>

</div>

</div>

<!-- VISITAS -->

<div id="visitas" class="panel">

<h2>Resumen visitas</h2>

<div class="grid">

<div class="card">

<h3>0</h3>

<p>Clientes registrados</p>

</div>

<div class="card">

<h3>0</h3>

<p>Visitas</p>

</div>

<div class="card">

<h3>0</h3>

<p>Recompensas</p>

</div>

</div>

</div>

<!-- TARJETA -->

<div id="tarjeta" class="panel">

<h2>Configurar tarjeta</h2>

<div class="card">

<input
id="cardName"
placeholder="Nombre tarjeta"
>

<input
id="cardColor"
placeholder="Color principal (#3A7BFF)"
>

<button
class="primary"
onclick="saveCard()"
>

Guardar

</button>

</div>

</div>

<!-- QR -->

<div id="qr" class="panel">

<h2>Descargar QR</h2>

<div class="card qr">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://tarjetalink.github.io/fidelizacion"
>

</div>

</div>

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getFirestore,

collection,

addDoc,

serverTimestamp,

onSnapshot

}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyA6BsCxdMu8CoFQJ2tcrPR0KPK9BFDloIU",

authDomain:"tarjeta-link-94df7.firebaseapp.com",

projectId:"tarjeta-link-94df7",

storageBucket:"tarjeta-link-94df7.firebasestorage.app",

messagingSenderId:"502965046746",

appId:"1:502965046746:web:ceb673b54e066805f284e3"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const businessId=
"Ad1Te5MFbW6PoPkY1dkL";

window.show=function(id){

document
.querySelectorAll(".panel")
.forEach(
p=>
p.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

};

window.saveCard=
async function(){

const name=
cardName.value;

const color=
cardColor.value;

await addDoc(

collection(
db,
"cards"
),

{

name,

color,

businessId,

createdAt:
serverTimestamp()

}

);

alert(
"Tarjeta guardada"
);

};

window.saveCustomer=
async function(){

const name=
customerName.value;

const phone=
customerPhone.value;

await addDoc(

collection(
db,
"customers"
),

{

name,

phone,

businessId,

visits:0,

points:0,

status:"active",

createdAt:
serverTimestamp()

}

);

customerName.value="";
customerPhone.value="";

};

onSnapshot(

collection(
db,
"customers"
),

(snapshot)=>{

let html="";

snapshot.forEach(doc=>{

let d=
doc.data();

if(
d.businessId!==businessId
)
return;

html+=`

<tr>

<td>${d.name}</td>

<td>${d.phone}</td>

<td>${d.visits}</td>

</tr>

`;

});

if(html===""){

html=`

<tr>

<td colspan="3">

Sin clientes

</td>

</tr>

`;

}

customerList.innerHTML=
html;

}

);

</script>

</body>

</html>
