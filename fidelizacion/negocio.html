<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Panel Negocio | Tarjeta Link</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#091326;
color:white;
}

.container{
display:grid;
grid-template-columns:260px 1fr;
min-height:100vh;
}

.sidebar{

background:#111c3d;

padding:30px;

}

.logo{

font-size:28px;

font-weight:bold;

margin-bottom:40px;

}

.menu{

display:flex;

flex-direction:column;

gap:12px;

}

.menu button{

padding:14px;

background:#18284e;

border:none;

color:white;

border-radius:10px;

cursor:pointer;

text-align:left;

}

.content{

padding:30px;

}

.panel{

display:none;

}

.panel.active{

display:block;

}

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:20px;

}

.card{

background:#131f45;

padding:20px;

border-radius:16px;

}

input{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:8px;

}

button.primary{

margin-top:12px;

padding:12px;

background:#3a7bff;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

width:100%;

}

table{

width:100%;

margin-top:20px;

border-collapse:collapse;

}

th,td{

padding:14px;

border-bottom:1px solid #223760;

}

.qr{

text-align:center;

padding:40px;

}

.qr img{

width:220px;

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">
TARJETA LINK
</div>

<div class="menu">

<button onclick="show('clientes')">
👥 Clientes
</button>

<button onclick="show('recompensas')">
🎁 Recompensas
</button>

<button onclick="show('visitas')">
📈 Visitas
</button>

<button onclick="show('tarjeta')">
🎨 Configurar Tarjeta
</button>

<button onclick="show('qr')">
📲 Descargar QR
</button>

</div>

</div>

<div class="content">

<!-- CLIENTES -->

<div
id="clientes"
class="panel active"
>

<h2>
Clientes
</h2>

<div class="card">

<table>

<thead>

<tr>

<th>Cliente</th>

<th>Visitas</th>

</tr>

</thead>

<tbody>

<tr>

<td>
Sin registros
</td>

<td>
—
</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- RECOMPENSAS -->

<div
id="recompensas"
class="panel"
>

<h2>
Crear recompensa
</h2>

<div class="card">

<input
placeholder="Nombre recompensa"
>

<input
placeholder="Visitas requeridas"
>

<button
class="primary"
>

Guardar

</button>

</div>

</div>

<!-- VISITAS -->

<div
id="visitas"
class="panel"
>

<h2>
Resumen visitas
</h2>

<div class="grid">

<div class="card">

<h3>
0
</h3>

<p>
Clientes registrados
</p>

</div>

<div class="card">

<h3>
0
</h3>

<p>
Visitas
</p>

</div>

<div class="card">

<h3>
0
</h3>

<p>
Recompensas
</p>

</div>

</div>

</div>

<!-- TARJETA -->

<div
id="tarjeta"
class="panel"
>

<h2>
Configurar tarjeta
</h2>

<div class="card">

<input
placeholder="Nombre tarjeta"
>

<input
placeholder="Color principal"
>

<button
class="primary"
>

Guardar

</button>

</div>

</div>

<!-- QR -->

<div
id="qr"
class="panel"
>

<h2>
Descargar QR
</h2>

<div class="card qr">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://tarjetalink.github.io/fidelizacion"
>

<br><br>

<a
href="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://tarjetalink.github.io/fidelizacion"
download
>

<button class="primary">

Descargar QR

</button>

</a>

</div>

</div>

</div>

</div>

<script>

function show(id){

document
.querySelectorAll(".panel")
.forEach(p=>
p.classList
.remove("active")
);

document
.getElementById(id)
.classList
.add("active");

}

</script>

</body>

</html>
